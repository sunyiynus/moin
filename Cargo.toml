[package]
name = "moin"
version = "0.2.0"
edition = "2024"
default-run = "moin"

[dependencies]
anyhow = "1"
base64 = "0.22"
arrow-array = "56.2"
arrow-schema = "56.2"
async-channel = "2"
# GPUI and DataFusion must share the xz2 native compression provider.
async-compression = { version = "=0.4.19", default-features = false }
directories = "6"
extism = { version = "=1.41.0", default-features = false }
futures = "0.3"
flate2 = "1"
gif = { version = "=0.13.3", features = ["raii_no_panic"] }
# GPUI Kit pins its GPUI core to the gpui-pre 0.3.12 snapshot and re-exports it.
# Alias the same package as `gpui` so the existing `use gpui::...` paths stay compatible.
gpui = { package = "gpui-pre", version = "=0.3.12", default-features = false, features = ["windows-manifest"] }
gpui-kit = "0.10.0"
image = { version = "0.25", default-features = false, features = ["png"] }
html5ever = "0.27"
markup5ever_rcdom = "0.3"
lancedb = { version = "=0.23.1", default-features = false }
lurker-core-contract = "=0.68.7"
lurker-core-ports = "=0.68.7"
meval = "0.2"
mihomo-driver = { version = "0.68.7", default-features = false, features = ["http", "process"] }
plist = "1"
rig = { package = "rig-core", version = "=0.46.0", default-features = false, features = ["reqwest", "rustls"] }
rig-agent = { version = "=0.46.0", default-features = false }
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
quick-xml = "0.42"
percent-encoding = "2"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"] }
unicode-segmentation = "1.12"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
url = "2"
walkdir = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block = "=0.1.6"
cocoa = "=0.26.0"
fs2 = "0.4"
global-hotkey = "0.8"
gpui = { package = "gpui-pre", version = "=0.3.12", default-features = false, features = ["font-kit"] }
objc = "0.2"
raw-window-handle = "0.6"
tray-icon = { version = "=0.26.1", default-features = false }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", default-features = false, features = ["test-support"] }
tempfile = "3"
wat = "1"
